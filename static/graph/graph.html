<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Integer Graph Explorer</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/logo_animation.css">
  <link rel="stylesheet" href="/static/graph/graph.css">
</head>
<body>
  <div id="cy"></div>
  <div id="info">click a node to expand its neighbors downward</div>
  <div id="edge-tooltip"></div>
  <button id="back-btn" disabled>&#8592; back</button>
  <div id="trace-panel">
    <label id="trace-label" for="trace-input">trace path</label>
    <input id="trace-input" type="text" placeholder="A or 65" autocomplete="off" spellcheck="false">
    <span id="trace-error"></span>
  </div>
  <div id="strategy-panel">
    <div id="strategy-panel-title">strategies <span id="strategy-panel-toggle">&#8722;</span></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.26.0/cytoscape.min.js"></script>
  <script src="/static/graph/graph_styles.js"></script>
  <script src="/static/graph/graph_config.js"></script>
  <script src="/static/graph/graph_layout.js"></script>
  <script src="/static/graph/graph_ui.js"></script>
  <script src="/static/graph/graph_traversal.js"></script>
  <script src="/static/graph/graph.js"></script>
</body>
</html>
