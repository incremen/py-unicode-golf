<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ඞ&nbsp;&nbsp;&nbsp;&nbsp;Graph</title>
  <link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/logo_animation.css">
  <link rel="stylesheet" href="/static/graph/graph.css">
</head>
<body>
  <div id="cy"></div>
  <div id="info">click a node to expand its neighbors downward</div>
  <div id="edge-tooltip"></div>
  <div id="char-popup"></div>
  <button id="back-btn" disabled>&#8592; back</button>
  <div id="trace-panel">
    <div id="trace-title">trace path</div>
    <div id="trace-subtitle">unicode char or int (0–200000)</div>
    <input id="trace-input" type="text" autocomplete="off" spellcheck="false">
    <div class="toggle" id="trace-db-toggle">
      <input type="checkbox" id="traceUseDb" checked>
      <label for="traceUseDb">use optimized database</label>
    </div>
    <span id="trace-error"></span>
  </div>
  <div id="strategy-panel" class="collapsed">
    <div id="strategy-panel-title">strategies <span id="strategy-panel-toggle">&#43;</span></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.26.0/cytoscape.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <script src="/static/graph/graph_styles.js"></script>
  <script src="/static/graph/graph_config.js"></script>
  <script src="/static/graph/graph_audio.js"></script>
  <script src="/static/graph/graph_layout.js"></script>
  <script src="/static/graph/graph_ui.js"></script>
  <script src="/static/graph/graph_traversal.js"></script>
  <script src="/static/graph/graph.js"></script>
</body>
</html>
