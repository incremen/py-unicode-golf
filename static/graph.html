<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Integer Graph Explorer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #12151e; overflow: hidden; }
    #cy { width: 100vw; height: 100vh; }
    #info {
      position: fixed; top: 12px; left: 12px;
      color: #aaa; font: 13px/1.6 monospace;
      background: rgba(18,21,30,0.8); padding: 6px 10px; border-radius: 4px;
    }
  </style>
</head>
<body>
  <div id="cy"></div>
  <div id="info">click a node to expand its neighbors downward</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.26.0/cytoscape.min.js"></script>
  <script>
    const STRATEGY_COLORS = {
      decrement:    '#e74c3c',
      triple:       '#2ecc71',
      quad_plus_3:  '#5dade2',
      triangular:   '#9b59b6',
      bytearray_4x: '#f39c12',
    };

    const VERTICAL_SPACING   = 140;
    const HORIZONTAL_SPACING = 110;

    const cy = cytoscape({
      container: document.getElementById('cy'),
      userZoomingEnabled: true,
      userPanningEnabled: true,
      style: [
        {
          selector: 'node',
          style: {
            'background-color': '#2c3e50',
            'border-color': '#4a5568',
            'border-width': 2,
            'color': 'white',
            'label': 'data(label)',
            'font-family': 'Courier New',
            'font-size': '13px',
            'text-valign': 'center',
            'text-halign': 'center',
            'width': 46,
            'height': 46,
          }
        },
        {
          selector: 'node.expanded',
          style: { 'border-color': '#2ecc71', 'border-width': 3 }
        },
        {
          selector: 'node.focused',
          style: { 'background-color': '#1a3a5c', 'border-color': '#5dade2', 'border-width': 3 }
        },
        {
          selector: 'edge',
          style: {
            'width': 2,
            'line-color': 'data(color)',
            'target-arrow-color': 'data(color)',
            'target-arrow-shape': 'triangle',
            'curve-style': 'bezier',
            'label': 'data(strategy)',
            'font-family': 'Courier New',
            'font-size': '9px',
            'color': 'data(color)',
            'text-background-color': '#12151e',
            'text-background-opacity': 0.85,
            'text-background-padding': '2px',
          }
        }
      ]
    });

    const expandedNodes = new Set();

    function placeNode(nodeId, x, y) {
      const id = String(nodeId);
      if (!cy.getElementById(id).length) {
        cy.add({ data: { id, label: id }, position: { x, y } });
      }
    }

    async function expandNode(nodeId) {
      const id = String(nodeId);
      if (expandedNodes.has(id)) return;
      expandedNodes.add(id);

      const response = await fetch(`/api/neighbors/${nodeId}`);
      const data = await response.json();

      const focusEl = cy.getElementById(id);
      const focusPos = focusEl.position();
      focusEl.addClass('expanded');

      const unplaced = data.neighbors.filter(n => !cy.getElementById(String(n.id)).length);
      const totalWidth = (unplaced.length - 1) * HORIZONTAL_SPACING;
      const startX = focusPos.x - totalWidth / 2;
      const targetY = focusPos.y + VERTICAL_SPACING;

      unplaced.forEach((neighbor, index) => {
        placeNode(neighbor.id, startX + index * HORIZONTAL_SPACING, targetY);
      });

      for (const neighbor of data.neighbors) {
        const edgeId = `e-${data.focus}-${neighbor.id}-${neighbor.strategy}`;
        if (!cy.getElementById(edgeId).length) {
          cy.add({
            data: {
              id: edgeId,
              source: id,
              target: String(neighbor.id),
              strategy: neighbor.strategy,
              color: STRATEGY_COLORS[neighbor.strategy] || '#888',
            }
          });
        }
      }

      cy.animate({ fit: { eles: cy.nodes(), padding: 60 }, duration: 400, easing: 'ease-in-out-quad' });

      document.getElementById('info').textContent =
        `node ${data.focus}  →  ${data.neighbors.length} neighbors  |  ${expandedNodes.size} expanded total`;
    }

    cy.on('tap', 'node', function(evt) {
      const nodeId = parseInt(evt.target.id(), 10);
      cy.nodes().removeClass('focused');
      evt.target.addClass('focused');
      expandNode(nodeId);
    });

    // Seed at top center
    placeNode(0, window.innerWidth / 2, 80);
    cy.nodes().first().addClass('focused');
    expandNode(0);
  </script>
</body>
</html>
